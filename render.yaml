databases:
  - name: prismos-db
    plan: free
    region: frankfurt
    databaseName: prismos
    user: prismos

services:
  - type: web
    name: prismos
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: prismos-db
          property: connectionString
      - key: NODE_ENV
        value: production